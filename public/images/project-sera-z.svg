<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Sera-Z — case-file illustration</title>
  <desc id="desc">An ink illustration of a phone framing a shirt, colour swatches, and a neural path.</desc>
  <defs>
    <pattern id="halftone" width="7" height="7" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.3" fill="#101010"/>
    </pattern>
    <pattern id="goldDots" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.2" fill="#B99A63"/>
    </pattern>
    <clipPath id="screen">
      <rect x="264" y="92" width="272" height="432" rx="4"/>
    </clipPath>
  </defs>

  <rect width="800" height="600" fill="#F0E6D2"/>
  <rect x="14" y="14" width="772" height="572" fill="none" stroke="#101010" stroke-width="5"/>
  <rect x="26" y="26" width="748" height="548" fill="none" stroke="#101010" stroke-width="1"/>

  <circle cx="400" cy="318" r="216" fill="#9F252D" stroke="#101010" stroke-width="4"/>
  <circle cx="400" cy="318" r="228" fill="none" stroke="#101010" stroke-width="1" stroke-dasharray="3 7"/>
  <rect x="170" y="118" width="460" height="406" fill="url(#halftone)" opacity="0.14" clip-path="circle(216px at 400px 318px)"/>

  <!-- hanger -->
  <g fill="none" stroke="#101010" stroke-width="4">
    <path d="M74 156c0-20 26-30 38-14 8 10 2 22-10 24"/>
    <path d="M64 170l38 24 38-24"/>
    <path d="M102 194v26"/>
  </g>

  <!-- color swatches -->
  <g stroke="#101010" stroke-width="3">
    <circle cx="618" cy="452" r="22" fill="#9F252D"/>
    <circle cx="672" cy="452" r="22" fill="#B99A63"/>
    <circle cx="726" cy="452" r="22" fill="#F0E6D2"/>
    <circle cx="618" cy="506" r="22" fill="#101010"/>
    <circle cx="672" cy="506" r="22" fill="#8A8A80"/>
    <circle cx="726" cy="506" r="22" fill="#242323"/>
  </g>

  <!-- phone -->
  <g>
    <rect x="248" y="64" width="304" height="488" rx="24" fill="#101010" stroke="#101010" stroke-width="5"/>
    <rect x="264" y="80" width="272" height="456" rx="8" fill="#F0E6D2" stroke="#B99A63" stroke-width="2"/>
    <rect x="250" y="76" width="300" height="468" rx="18" fill="none" stroke="#F0E6D2" stroke-width="1" opacity="0.25"/>
    <rect x="318" y="82" width="72" height="12" rx="6" fill="#101010"/>
    <circle cx="410" cy="88" r="4" fill="#9F252D"/>

    <g clip-path="url(#screen)">
      <rect x="264" y="92" width="272" height="432" fill="url(#goldDots)" opacity="0.1"/>
      <rect x="264" y="92" width="272" height="48" fill="#101010"/>
      <path d="M286 116h72M476 116h22" stroke="#F0E6D2" stroke-width="3"/>

      <!-- shirt -->
      <g fill="#F0E6D2" stroke="#101010" stroke-width="5">
        <path d="M330 222l34-18h72l34 18 20 54-38 18-10-24v122H358V270l-10 24-38-18Z"/>
        <path d="M364 204c8 16 64 16 72 0" fill="none" stroke-width="4"/>
      </g>
      <path d="M374 268h52v84h-52Z" fill="#9F252D" stroke="#101010" stroke-width="3"/>
      <path d="M386 292l26 26M412 292l-26 26" stroke="#F0E6D2" stroke-width="4"/>

      <!-- colour bars -->
      <g stroke="#101010" stroke-width="2">
        <rect x="292" y="424" width="44" height="22" fill="#9F252D"/>
        <rect x="344" y="424" width="44" height="22" fill="#B99A63"/>
        <rect x="396" y="424" width="44" height="22" fill="#101010"/>
        <rect x="448" y="424" width="44" height="22" fill="#F0E6D2"/>
      </g>
      <path d="M292 464h200M292 480h132" stroke="#101010" stroke-width="3" opacity="0.55"/>
      <rect x="292" y="498" width="200" height="34" fill="#9F252D" stroke="#101010" stroke-width="3"/>
      <path d="M320 515h64M442 515h24" stroke="#F0E6D2" stroke-width="3"/>
    </g>

    <!-- camera -->
    <circle cx="400" cy="526" r="10" fill="#B99A63" stroke="#F0E6D2" stroke-width="2"/>
  </g>

  <!-- neural path -->
  <g fill="none" stroke="#101010" stroke-width="2.5" stroke-dasharray="6 6">
    <path d="M552 196c42 0 58-32 92-32M552 232c52 0 66 32 102 32M552 268c40 0 54 30 84 30"/>
  </g>
  <g fill="#101010" stroke="#B99A63" stroke-width="2">
    <circle cx="650" cy="164" r="12"/>
    <circle cx="662" cy="264" r="12"/>
    <circle cx="642" cy="298" r="12"/>
  </g>
  <g fill="none" stroke="#9F252D" stroke-width="3">
    <path d="M632 164h36M644 264h36M624 298h36"/>
  </g>

  <!-- sparkles -->
  <g fill="none" stroke="#101010" stroke-width="3">
    <path d="M154 308v44M132 330h44"/>
    <path d="M700 240v30M685 255h30"/>
  </g>
  <path d="M110 500l26-12M136 488l-12-26M136 488l26 12" fill="none" stroke="#101010" stroke-width="2" opacity="0.5"/>

  <path d="M52 74h44M52 74v44" stroke="#9F252D" stroke-width="4"/>
  <path d="M748 526v44h-44" stroke="#9F252D" stroke-width="4"/>
</svg>
