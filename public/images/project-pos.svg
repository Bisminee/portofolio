<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">POS Tahu Morojoyo — case-file illustration</title>
  <desc id="desc">An ink illustration of a receipt, point-of-sale terminal, tofu cubes, and connected branch nodes.</desc>
  <defs>
    <pattern id="halftone" width="7" height="7" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.3" fill="#101010"/>
    </pattern>
    <pattern id="goldDots" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.2" fill="#B99A63"/>
    </pattern>
  </defs>

  <rect width="800" height="600" fill="#F0E6D2"/>
  <rect x="14" y="14" width="772" height="572" fill="none" stroke="#101010" stroke-width="5"/>
  <rect x="26" y="26" width="748" height="548" fill="none" stroke="#101010" stroke-width="1"/>

  <rect x="560" y="26" width="214" height="150" fill="url(#halftone)" opacity="0.22"/>
  <rect x="26" y="470" width="180" height="104" fill="url(#goldDots)" opacity="0.25"/>

  <!-- red sun -->
  <circle cx="628" cy="152" r="86" fill="#9F252D" stroke="#101010" stroke-width="5"/>
  <circle cx="628" cy="152" r="96" fill="none" stroke="#101010" stroke-width="1" stroke-dasharray="3 6"/>

  <!-- receipt -->
  <g>
