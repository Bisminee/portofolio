    <g fill="#101010">
      <circle cx="126" cy="438" r="6"/><circle cx="146" cy="438" r="6"/><circle cx="166" cy="438" r="6"/><circle cx="186" cy="438" r="6"/><circle cx="206" cy="438" r="6"/><circle cx="226" cy="438" r="6"/><circle cx="246" cy="438" r="6"/><circle cx="266" cy="438" r="6"/><circle cx="286" cy="438" r="6"/><circle cx="306" cy="438" r="6"/><circle cx="326" cy="438" r="6"/>
