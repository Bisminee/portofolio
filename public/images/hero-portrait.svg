<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 900" role="img" aria-labelledby="title desc">
  <title id="title">The Archivist — original ink illustration</title>
  <desc id="desc">A hooded figure beneath a gothic arch, a blood moon behind, ravens crossing a stormy sky.</desc>
  <defs>
    <pattern id="dots" width="7" height="7" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.35" fill="#101010"/>
    </pattern>
    <pattern id="dotsGold" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.2" fill="#B99A63"/>
    </pattern>
    <pattern id="hatch" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <line x1="0" y1="0" x2="0" y2="9" stroke="#F0E6D2" stroke-width="1.2" opacity="0.35"/>
    </pattern>
    <clipPath id="arch">
      <path d="M104 762V348c0-144 108-222 256-222s256 78 256 222v414Z"/>
    </clipPath>
    <clipPath id="moon">
      <circle cx="486" cy="296" r="82"/>
    </clipPath>
  </defs>

  <rect width="720" height="900" fill="#F0E6D2"/>
  <rect x="18" y="18" width="684" height="864" fill="none" stroke="#101010" stroke-width="5"/>
  <rect x="32" y="32" width="656" height="836" fill="none" stroke="#101010" stroke-width="1.2"/>
  <rect x="44" y="44" width="632" height="812" fill="url(#dots)" opacity="0.12"/>

  <!-- corner registration marks -->
  <g stroke="#101010" stroke-width="2">
    <path d="M18 62h24M62 18v24M702 62h-24M658 18v24M18 838h24M62 882v-24M702 838h-24M658 882v-24"/>
  </g>

  <!-- arch stonework -->
  <path d="M68 790V338c0-172 128-252 292-252s292 80 292 252v452" fill="none" stroke="#101010" stroke-width="12"/>
  <path d="M86 790V346c0-160 118-236 274-236s274 76 274 236v444" fill="none" stroke="#B99A63" stroke-width="2"/>

  <g clip-path="url(#arch)">
    <rect x="90" y="110" width="560" height="660" fill="#171616"/>
    <rect x="90" y="110" width="560" height="660" fill="url(#dots)" opacity="0.28"/>

    <!-- storm bands -->
    <g fill="none" stroke="#F0E6D2" stroke-width="2" opacity="0.18">
      <path d="M90 210c70-28 118 10 178-12s92-46 164-30 108 6 138-4"/>
      <path d="M90 244c82-20 118 12 188-8s104-34 162-18 96 4 130-6"/>
      <path d="M90 520c96-26 130 8 206-12s112-30 174-10 80 12 100 4"/>
    </g>

    <!-- moon -->
    <circle cx="486" cy="296" r="82" fill="#9F252D" stroke="#101010" stroke-width="6"/>
    <g clip-path="url(#moon)">
      <rect x="404" y="214" width="164" height="164" fill="url(#dots)" opacity="0.5"/>
      <path d="M430 240c34 14 66 12 92-2M418 322c44 26 92 28 132 4" fill="none" stroke="#101010" stroke-width="3" opacity="0.55"/>
    </g>
    <circle cx="486" cy="296" r="98" fill="none" stroke="#B99A63" stroke-width="1" stroke-dasharray="2 7" opacity="0.7"/>

    <!-- castle silhouette -->
    <g fill="#101010">
      <path d="M90 760V592h34v-36h22v36h20v-58h26v58h22v-30h34v30h24v-48h28v48h20v-22h28v22h20v-44h30v44h20v-30h26v30h22v-54h24v54h28v-26h22v26h22v168Z"/>
      <path d="M148 592V548l12-22 12 22v44ZM296 592V530l14-26 14 26v62ZM520 592V542l12-24 12 24v50Z"/>
    </g>
    <g fill="#B99A63" opacity="0.8">
      <rect x="170" y="640" width="8" height="16"/>
      <rect x="214" y="672" width="8" height="16"/>
      <rect x="348" y="648" width="8" height="16"/>
      <rect x="408" y="690" width="8" height="16"/>
      <rect x="548" y="656" width="8" height="16"/>
      <rect x="586" y="700" width="8" height="16"/>
    </g>

    <!-- fog -->
    <g fill="#F0E6D2" opacity="0.1">
      <ellipse cx="186" cy="712" rx="150" ry="26"/>
      <ellipse cx="556" cy="736" rx="176" ry="30"/>
      <ellipse cx="380" cy="752" rx="230" ry="24"/>
    </g>

    <!-- figure -->
    <g>
      <path d="M154 762c22-104 74-158 140-186l132 1c70 30 122 86 144 185Z" fill="#0A0A0A" stroke="#101010" stroke-width="6"/>
      <path d="M292 578c-48-42-58-122-38-176 18-50 58-82 106-82s88 32 106 82c20 54 10 134-38 176Z" fill="#0A0A0A" stroke="#101010" stroke-width="6"/>
      <path d="M292 578c58 24 118 24 176 0" fill="none" stroke="#B99A63" stroke-width="1.5" opacity="0.6"/>
      <path d="M322 438c14-30 58-44 86-22 18 14 26 40 20 66-6 30-32 52-60 46-30-6-54-52-46-90Z" fill="#141414" stroke="#101010" stroke-width="4"/>
      <path d="M330 450c-2 40 18 66 42 68 20 2 38-12 46-32-18 10-38 12-58 2-18-10-26-24-30-38Z" fill="#F0E6D2" opacity="0.14"/>
      <path d="M352 470c8 6 18 9 28 9" fill="none" stroke="#F0E6D2" stroke-width="2" opacity="0.35"/>
      <circle cx="358" cy="452" r="3.5" fill="#C03540"/>
      <circle cx="396" cy="452" r="2.5" fill="#9F252D"/>
      <path d="M292 578c-58 20-104 68-124 132M468 578c58 20 104 68 124 132" fill="none" stroke="#F0E6D2" stroke-width="1" opacity="0.12"/>
      <path d="M320 600c40 26 90 30 132 4M300 660c54 30 108 32 164 2" fill="none" stroke="#F0E6D2" stroke-width="1" opacity="0.1"/>
      <path d="M260 762l22-104 38 104ZM500 762l-22-104-38 104Z" fill="#101010"/>
      <path d="M264 620l50 36M492 620l-50 36" stroke="#B99A63" stroke-width="1" opacity="0.4"/>
    </g>

    <!-- ravens -->
    <g fill="#101010">
      <path d="M168 236c14-4 26-14 34-28 2 14 10 24 22 30-14 2-26 10-34 22-1-12-9-21-22-24Z"/>
      <path d="M226 188c10-3 18-10 24-20 2 10 8 17 16 21-10 2-19 8-24 16-1-8-7-15-16-17Z"/>
      <path d="M544 208c12-3 22-11 28-23 2 11 8 19 18 24-12 2-22 8-28 18-1-10-7-17-18-19Z"/>
    </g>
    <path d="M584 402c18-4 30-16 38-34 3 16 12 28 26 36-16 2-30 10-40 24-1-14-10-23-24-26Z" fill="#101010" opacity="0.85"/>
  </g>

  <!-- arch keystone -->
  <path d="M342 86h36l10 34h-56Z" fill="#B99A63" stroke="#101010" stroke-width="3"/>
  <path d="M350 96h20M346 106h28" stroke="#101010" stroke-width="2"/>

  <!-- side ornaments -->
  <g fill="none" stroke="#101010" stroke-width="2">
    <path d="M62 176c-16 28-16 52 0 80M658 176c16 28 16 52 0 80"/>
    <path d="M62 420c-12 22-12 42 0 64M658 420c12 22 12 42 0 64"/>
  </g>
  <g fill="#9F252D">
    <path d="M56 214l8 12-8 12-8-12Z"/>
    <path d="M664 214l8 12-8 12-8-12Z"/>
    <path d="M56 452l6 9-6 9-6-9Z"/>
    <path d="M664 452l6 9-6 9-6-9Z"/>
  </g>

  <!-- lower plaque -->
  <rect x="82" y="796" width="556" height="52" fill="#101010" stroke="#101010" stroke-width="2"/>
  <rect x="88" y="802" width="544" height="40" fill="none" stroke="#B99A63" stroke-width="1"/>
  <path d="M110 822h190M420 822h190" stroke="#F0E6D2" stroke-width="1" opacity="0.45"/>
  <path d="M360 812l10 10-10 10-10-10Z" fill="#9F252D" stroke="#B99A63" stroke-width="1"/>
</svg>
