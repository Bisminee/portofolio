<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Machine Learning Practicals — case-file illustration</title>
  <desc id="desc">An ink illustration of a scatter plot, a confusion matrix, and a notebook page.</desc>
  <defs>
    <pattern id="halftone" width="7" height="7" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.3" fill="#101010"/>
    </pattern>
    <pattern id="redDots" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.2" fill="#9F252D"/>
    </pattern>
  </defs>

  <rect width="800" height="600" fill="#F0E6D2"/>
  <rect x="14" y="14" width="772" height="572" fill="none" stroke="#101010" stroke-width="5"/>
  <rect x="26" y="26" width="748" height="548" fill="none" stroke="#101010" stroke-width="1"/>
  <rect x="26" y="26" width="748" height="120" fill="url(#halftone)" opacity="0.12"/>

  <!-- scatter plot -->
  <g>
    <rect x="70" y="108" width="400" height="330" fill="#F0E6D2" stroke="#101010" stroke-width="3"/>
    <path d="M70 438h400M70 108v330" fill="none" stroke="#101010" stroke-width="4"/>
    <g stroke="#101010" stroke-width="1" opacity="0.2">
      <path d="M120 108v330M170 108v330M220 108v330M270 108v330M320 108v330M370 108v330M420 108v330"/>
      <path d="M70 160h400M70 215h400M70 270h400M70 325h400M70 380h400"/>
    </g>

    <path d="M96 394L446 152" stroke="#9F252D" stroke-width="4"/>
    <g fill="#101010">
      <circle cx="124" cy="372" r="7"/><circle cx="142" cy="356" r="7"/><circle cx="166" cy="388" r="7"/>
      <circle cx="190" cy="330" r="7"/><circle cx="208" cy="344" r="7"/><circle cx="238" cy="302" r="7"/>
      <circle cx="256" cy="318" r="7"/><circle cx="284" cy="284" r="7"/><circle cx="308" cy="266" r="7"/>
      <circle cx="330" cy="250" r="7"/><circle cx="360" cy="214" r="7"/><circle cx="392" cy="228" r="7"/>
      <circle cx="414" cy="190" r="7"/><circle cx="306" cy="350" r="7"/><circle cx="270" cy="372" r="7"/>
    </g>
    <g fill="#9F252D">
      <circle cx="152" cy="410" r="7"/><circle cx="196" cy="398" r="7"/><circle cx="226" cy="418" r="7"/>
      <circle cx="344" cy="384" r="7"/><circle cx="382" cy="360" r="7"/><circle cx="420" cy="338" r="7"/>
    </g>

    <path d="M70 108l-18-18M470 438l18 18" stroke="#B99A63" stroke-width="3"/>
    <rect x="82" y="120" width="92" height="26" fill="#101010"/>
    <path d="M94 133h50" stroke="#B99A63" stroke-width="2"/>
  </g>

  <!-- confusion matrix -->
  <g>
    <rect x="540" y="96" width="206" height="206" fill="#101010" stroke="#101010" stroke-width="3"/>
    <g stroke="#F0E6D2" stroke-width="2">
      <rect x="548" y="104" width="190" height="190" fill="none"/>
      <path d="M611.3 104v190M674.6 104v190M548 167.3h190M548 230.6h190"/>
    </g>
    <g>
      <rect x="554" y="110" width="51" height="51" fill="#9F252D"/>
      <rect x="617" y="173" width="51" height="51" fill="#B99A63"/>
      <rect x="680" y="236" width="51" height="51" fill="#9F252D"/>
      <rect x="680" y="110" width="51" height="51" fill="#F0E6D2"/>
    </g>
    <path d="M548 104h190v190h-190Z" fill="url(#redDots)" opacity="0.12"/>
  </g>

  <!-- notebook -->
  <g>
    <path d="M540 338h206v174H540Z" fill="#F0E6D2" stroke="#101010" stroke-width="4"/>
    <path d="M540 338h206v36H540Z" fill="#9F252D"/>
    <path d="M540 374h206" stroke="#101010" stroke-width="2"/>
    <path d="M558 402h128M558 424h168M558 446h110M558 468h150M558 490h82" stroke="#101010" stroke-width="2.5" opacity="0.55"/>
    <g fill="#101010">
      <circle cx="558" cy="402" r="3"/><circle cx="558" cy="424" r="3"/><circle cx="558" cy="446" r="3"/>
    </g>
    <path d="M696 446l30 30M726 446l-30 30" stroke="#101010" stroke-width="2" opacity="0.3"/>
  </g>

  <!-- axis labels as marks -->
  <g fill="#101010">
    <rect x="70" y="456" width="34" height="4"/><rect x="70" y="468" width="16" height="4"/>
    <rect x="486" y="424" width="4" height="18"/><rect x="486" y="400" width="4" height="10"/>
  </g>

  <path d="M60 76h40M60 76v40" stroke="#9F252D" stroke-width="4"/>
  <path d="M744 526v40h-40" stroke="#9F252D" stroke-width="4"/>
</svg>
